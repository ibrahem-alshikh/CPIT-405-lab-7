<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CPIT-405 lab 7</title>
<h1><a href="https://cpit405.gitlab.io/labs/lab-7/">Lab 7: HTML</a></h1>

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        /* Top bar styling to match the lab reference image */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #f8f9fa;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .top-bar span {
            font-weight: bold;
        }
        .top-bar input {
            padding: 5px;
            width: 200px;
        }
        .top-bar button {
            padding: 5px 10px;
            cursor: pointer;
        }
        /* Gallery layout with larger images like the reference image */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .gallery img {
            width: 260px;
            height: 340px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Top Bar matching the lab description -->
    <div class="top-bar">
        <span>Unsplash API</span>
        <input type="text" id="searchInput" placeholder="Makkah" value="Makkah">
        <button onclick="searchWithXHR()">Search using XHR</button>
        <button onclick="searchWithPromise()">Search using fetch (promises)</button>
        <button onclick="searchWithAsync()">Search using fetch (async/await)</button>
    </div>

    <!-- Status message -->
    <p id="statusMsg" style="color: blue;"></p>

    <!-- Container to display images dynamically -->
    <div id="imageContainer" class="gallery"></div>

<script>
    // Your Unsplash Access Key
    var ACCESS_KEY = "zfFmIwVbjyCzhX-nCViTgFjwUC2btiVB_hkBieXizco";

    // Helper function to show images in the DOM
    function displayImages(photos) {
        var container = document.getElementById("imageContainer");
        container.innerHTML = ""; // Clear old results

        if (photos.length === 0) {
            container.innerHTML = "<p>No photos found.</p>";
            return;
        }

        for (var i = 0; i < photos.length; i++) {
            var img = document.createElement("img");
            img.src = photos[i].urls.small;
            img.alt = photos[i].alt_description;
            container.appendChild(img);
        }
    }

    // 1. XMLHttpRequest (XHR) Method
    function searchWithXHR() {
        var query = document.getElementById("searchInput").value;
        if (query == "") {
            alert("Please type a search query!");
            return;
        }

        document.getElementById("statusMsg").innerHTML = "Loading using XHR...";
        var url = "https://api.unsplash.com/search/photos?query=" + encodeURIComponent(query) + "&per_page=30";

        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.setRequestHeader("Authorization", "Client-ID " + ACCESS_KEY);

        xhr.onload = function() {
            if (xhr.status == 200) {
                var data = JSON.parse(xhr.responseText);
                displayImages(data.results);
                document.getElementById("statusMsg").innerHTML = "";
            } else {
                document.getElementById("statusMsg").innerHTML = "Error: " + xhr.status;
            }
        };

        xhr.onerror = function() {
            document.getElementById("statusMsg").innerHTML = "Network connection error!";
        };

        xhr.send();
    }

    // 2. Fetch with Promises (.then) Method
    function searchWithPromise() {
        var query = document.getElementById("searchInput").value;
        if (query == "") {
            alert("Please type a search query!");
            return;
        }

        document.getElementById("statusMsg").innerHTML = "Loading using fetch (promises)...";
        var url = "https://api.unsplash.com/search/photos?query=" + encodeURIComponent(query) + "&per_page=30";

        fetch(url, {
            headers: {
                "Authorization": "Client-ID " + ACCESS_KEY
            }
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error("HTTP error! status: " + response.status);
            }
            return response.json();
        })
        .then(function(data) {
            displayImages(data.results);
            document.getElementById("statusMsg").innerHTML = "";
        })
        .catch(function(error) {
            document.getElementById("statusMsg").innerHTML = "Error: " + error.message;
        });
    }

    // 3. Fetch with Async/Await Method
    async function searchWithAsync() {
        var query = document.getElementById("searchInput").value;
        if (query == "") {
            alert("Please type a search query!");
            return;
        }

        document.getElementById("statusMsg").innerHTML = "Loading using fetch (async/await)...";
        var url = "https://api.unsplash.com/search/photos?query=" + encodeURIComponent(query) + "&per_page=30";

        try {
            var response = await fetch(url, {
                headers: {
                    "Authorization": "Client-ID " + ACCESS_KEY
                }
            });

            if (!response.ok) {
                throw new Error("HTTP error! status: " + response.status);
            }

            var data = await response.json();
            displayImages(data.results);
            document.getElementById("statusMsg").innerHTML = "";
        } catch (error) {
            document.getElementById("statusMsg").innerHTML = "Error: " + error.message;
        }
    }
</script>

</body>
</html>
